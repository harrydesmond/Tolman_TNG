# Example schema for an ASTRODEEP-JWST-like catalogue.
# Replace flux column names with the actual downloaded catalogue names.

[catalog]
redshift_col = "z"
area_col = "aperture_area_arcsec2"
object_id_col = "id"
field_col = "field"
flags_col = "flags"
bad_flag_min = 80
blend_col = "is_blended"
edge_col = "is_edge"
point_source_col = "is_point_source"

[selection]
min_snr = 5
spec_mag_filter = "F200W"
spec_mag_limit = 29.0
z_min = 0.0
z_max = 14.0

[[filters]]
name = "F435W"
lambda_eff_angstrom = 4325
flux_col = "flux_F435W_uJy"
flux_err_col = "fluxerr_F435W_uJy"

